# Verify pull requests.
#
# Until the 2026-08-14 checks-that-lie pass, NO workflow ran on pull requests
# at all: pages.yml triggers only on push-to-main, and it never runs `npm ci`,
# so Playwright was never installed and not one of the 40+ verify:* browser
# gates could ever run in CI. Every PR landed unverified and the deploy job
# was the first thing to notice a red test — after merge.
#
# This job installs the real dependency tree and runs:
#   - npm test              183 suites / ~1,900 assertions, node-only
#   - npm run check         static manifests/cues/slots/orphans gate
#   - npm run check:flight  the Brushrunner flight-model bench, node-only
#   - npm run verify:campaign-route   fresh-save campaign topology, node-only
#   - npm run verify:geometry repo-wide headless mesh/collider geometry, node-only
#   - npm run certify:debt-ratchet  no-new architecture/semantic/liveness/spatial debt
#   - npm run verify:framing  camera framing, blocking, allowlisted exceptions
#   - npm run verify:dialogue:check / check:line-presence / check:rerecord
#   - npm run check:takes   recorded mp3s still say what the script says
#   - npm run voice:needed:check / audio:todo:check  booth sheets in step
#   - the sixteen per-scene cue ledgers (check:*-vo, check:mansion-sfx)
#   - npm run verify:boot-failure-surfaces      cheap browser gate, all 20 staged pages
#   - npm run verify:campaign-marathon the whole public route, scenes stubbed
#   - node tools/bundle-preview.mjs  the shareable single-file build
#
# Why only these two from the browser set: both are cheap per page covered
# because neither one boots a scene. verify:boot-failure-surfaces aborts each staged
# page's entry module and asserts the recovery surface, touching all 20 staged
# pages. verify:campaign-marathon stubs every scene runtime out and walks the
# whole public route — 27 handoffs, apartment day one to the finale — through
# the real skip adapters and a durable reload at each landing. The other
# verify:* gates each boot full scenes under swiftshader for minutes apiece,
# and as of the scene-gate pass they are no longer "local/manual for now":
# .github/workflows/verify-scenes.yml runs all forty on a schedule, one runner
# each, priced per gate in tools/scene-gate-tiers.mjs. Promote one up here only
# when a run of THAT workflow has measured it cheap enough to say so — the
# sentence this replaced said "for now" and meant "never".
#
# THE MARATHON IS HERE BECAUSE IT WAS BROKEN AND NOBODY KNEW. Its transition
# table said the Cartel Palace handed straight to Initiation; the route had
# gone through the Special Meeting since the day that scene was written. It
# failed at step 25 for weeks, silently, because nothing ran it. A gate that
# runs nowhere is not a gate. Of the 65 verify:*/check:* scripts in
# package.json, everything that runs headless is now wired in below —
# framing included. Staging now feeds the certification-debt ratchet: strict
# zero-debt audits remain red and actionable without making existing migration
# debt an excuse for CI to admit one more finding.
#
# verify:systemic-polish and verify:ground-combat are deliberately absent:
# they are convenience aliases that re-run suites `npm test` already runs, and
# their --test-isolation=none flag only parses on Node 23+.
#
# `npm run lint` is wired in as of the campaign/robustness pass: the two real
# ReferenceErrors it was blocked on (src/mansion/cast.js `marks`,
# src/silvercase/main.js `MISSION_IDS`) are fixed, so the gate that would have
# caught them at authoring time now runs on every PR. `--max-warnings` is NOT
# set: warnings stay advisory, errors fail the build.
name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The debt ceiling comes from the immutable base commit, never from
          # the PR's editable baseline. Missing/shallow history must fail.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repo-wide geometry gate
        run: npm run verify:geometry

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Static checks
        # Strict orphan gate: tools/sfx-orphan-allowlist.json was emptied by the
        # 2026-08-14 asset diet, so every recording on disk must be claimed by a
        # manifest cue and nothing can be parked in the allowlist again quietly.
        env:
          CHECK_SFX_ORPHANS: '1'
        run: npm run check

      - name: Flight-model bench
        run: npm run check:flight

      - name: Fresh-save campaign route
        run: npm run verify:campaign-route

      - name: Boot-failure recovery on every staged page
        run: npm run verify:boot-failure-surfaces

      - name: Whole-campaign marathon
        run: npm run verify:campaign-marathon

      # THE SHAREABLE BUILD, BUILT. Not booted -- verify:bundle's browser half
      # loads a 16 MB single file and is too slow for every pull request --
      # but produced, which is the half that broke. bundle-preview.mjs could
      # not handle `export { X } from './y.js'` and src/core/final-arc-loadout.js
      # has carried one for weeks, so the build has been dead the whole time
      # and nothing said so. Same trap as the in-world Squatch Smash bundle in
      # 23df84b: a re-export reads as an export and rewrites as nothing.
      - name: Single-file preview build
        run: node tools/bundle-preview.mjs

      # Strict architecture, semantic, liveness, and spatial certification is
      # intentionally red while the migration ledger is non-empty. CI applies
      # the subtractive baseline instead: every current record is pinned by a
      # stable ID, status, semantic fingerprint, and count. Removing debt is
      # green; adding, disguising, substituting, or growing it is red.
      - name: No-new certification debt
        env:
          EVENT_TRUSTED_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          trusted_ref="$EVENT_TRUSTED_REF"
          if [ -z "$trusted_ref" ] || printf '%s' "$trusted_ref" | grep -Eq '^0+$'; then
            trusted_ref=$(git rev-parse HEAD^)
          fi
          args=(--trusted-ref "$trusted_ref")
          if ! git cat-file -e "$trusted_ref:tools/certification-debt-baseline.json" 2>/dev/null; then
            # Only the initial landing can take this branch. The tool still
            # resolves the commit and uses ls-tree to prove PATH absence;
            # shallow history, bad refs, and unreadable existing files fail.
            args+=(--allow-missing-trusted-baseline)
          fi
          npm run certify:debt-ratchet -- "${args[@]}"

      # IT GATES NOW, AND THE ALLOWLIST IS EMPTY TO THE POINT OF BEING GONE.
      # It used to exit 0 with five findings on purpose while the backlog was
      # worked down — and all five were one artifact, Initiation authoring its
      # collision as height-less circles. Three went when the ray started being
      # tested against the circle the author wrote rather than its
      # circumscribing square; the other two were the parked cars, roofs at
      # 2.26 m under a collider band invented up to 4 m, and they went when
      # buildCar started measuring the car and passing y0/y1 through. So an
      # authored finding fails this step outright, and so would a list entry
      # that excused nothing. Derived cameras still only report.
      - name: Framing gate
        run: npm run verify:framing

      - name: Dialogue manifest
        run: npm run verify:dialogue:check

      - name: Line presence
        run: npm run check:line-presence

      # Line presence asks whether a cue has a recording. This asks the other
      # half, which nothing asked until now: can the player ever hear it? Every
      # per-scene ledger enumerates AUTHORED lines, so fourteen takes were
      # written, cast, cued, recorded, shipped and unreachable, and every gate
      # in this job was green the whole time. See tools/line-reachability.mjs.
      - name: Line reachability
        run: npm run check:reachability

      - name: Re-record queue
        run: npm run check:rerecord

      # Does the mp3 on disk still say what the script says? A rewritten line
      # keeps its cue id and its filename, so nothing else in this job can
      # tell. See tools/take-ledger.mjs.
      - name: Recorded takes match the script
        run: npm run check:takes

      - name: Booth sheets match the manifest
        run: |
          npm run voice:needed:check
          npm run audio:todo:check

      # One step for all seventeen cue ledgers. bash -e stops at the first
      # failure, and the step name that goes red names the scene.
      - name: Scene cue ledgers
        run: |
          npm run check:radio-vo
          npm run check:apartment-vo
          npm run check:beefrun-vo
          npm run check:bing-vo
          npm run check:cabin-vo
          npm run check:enolasquatch-vo
          npm run check:golf-vo
          npm run check:heist-vo
          npm run check:hotdog-vo
          npm run check:initiation-vo
          npm run check:mansion-sfx
          npm run check:mansion-vo
          npm run check:motel-vo
          npm run check:nowake-vo
          npm run check:siege-vo
          npm run check:silver-vo
          npm run check:silvercase-vo
