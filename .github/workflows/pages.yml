# Publish the complete campaign to GitHub Pages.
#
# The game is plain ES modules with no build step, so "deploying" is just
# copying the repository somewhere that serves files over HTTP. That is the
# whole point of the vendored three.js and the importmap in index.html.
#
# This is the full game: every scene, voice clip, and track is published.
name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces an older queued one but
# never cancels a deploy that is already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Fail the build rather than the browser: a manifest naming a file that
      # is not there is a 404 at runtime and a silent fallback in the game.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify the campaign
        run: |
          npm test
          npm run check
          npm run check:flight
          npm run verify:campaign-route
          npm run verify:dialogue:check

      # Everything the browser asks for, including the two development tools
      # linked from the public preview launcher.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html bing.html squatchfather.html motel.html beefrun.html cabin.html luxury-apartment.html \
             graveyard.html nowake.html silver.html golf.html heist.html initiation.html \
             silvercase.html mansion.html mansion-siege.html enolasquatch.html \
             cartel-palace.html specialmeeting.html preview.html roster.html \
             wardrobe.html combatlab.html weapon-sound-audition.html trophyroom.html \
             radioroom.html _site/
          cp -r src vendor assets game lib _site/
          # Every check below says what it wanted before it runs.
          #
          # This block used to be a silent run of `test -f` and `grep -q`
          # under `bash -e`. One stale path started failing on 25 August and
          # took every deploy with it, producing NO output at all -- the job
          # log went straight from the command echo to "exit code 1". A
          # staging check that cannot say what it was looking for is a check
          # that costs a day to read.
          fail=0
          need_file() {
            if [ -f "$1" ]; then echo "  ok       $1"
            else echo "  MISSING  $1"; fail=1; fi
          }
          need_ref() {
            if grep -q "$1" "$2"; then echo "  ok       $2 -> $1"
            else echo "  NO REF   $2 does not reference $1"; fail=1; fi
          }

          echo "Audio room:"
          need_file "_site/radioroom.html"

          echo "Scene pages:"
          for page in nowake graveyard heist golf cabin luxury-apartment silvercase \
                      mansion mansion-siege enolasquatch cartel-palace combatlab \
                      specialmeeting; do
            need_file "_site/$page.html"
          done

          echo "Scene roots:"
          for root in nowake graveyard heist golf cabin luxury-apartment silvercase \
                      mansion mansion/siege enolasquatch cartel-palace combatlab \
                      specialmeeting; do
            need_file "_site/src/$root/main.js"
          done

          echo "Each page loads its own root:"
          need_ref 'src/nowake/main.js' _site/nowake.html
          need_ref 'src/golf/main.js' _site/golf.html
          need_ref 'src/cabin/main.js' _site/cabin.html
          need_ref 'src/luxury-apartment/main.js' _site/luxury-apartment.html
          need_ref 'src/mansion/siege/main.js' _site/mansion-siege.html
          need_ref 'src/cartel-palace/main.js' _site/cartel-palace.html
          need_ref 'src/combatlab/main.js' _site/combatlab.html
          need_ref 'src/specialmeeting/main.js' _site/specialmeeting.html

          # Post-processing. This is the check that broke. Initiation used to
          # import EffectComposer straight out of lib/jsm; d9bdf5bc moved it
          # onto the shared PostFX module, which takes its passes from
          # vendor/addons. Nothing under src/ references lib/jsm/postprocessing
          # any more, so both of the old checks were guarding a path the game
          # had already stopped using.
          echo "Post-processing:"
          need_ref 'core/postfx.js' _site/src/initiation/main.js
          need_file _site/src/core/postfx.js
          need_file _site/vendor/addons/postprocessing/EffectComposer.js
          need_file _site/vendor/addons/postprocessing/UnrealBloomPass.js

          if [ "$fail" -ne 0 ]; then
            echo "::error::The staged site is missing something listed above."
            exit 1
          fi
          node tools/verify-pages-routes.mjs _site
          echo "Staged $(du -sh _site | cut -f1)"

      # Pages has to be switched on once, by hand, before this can deploy:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # `enablement: true` cannot do it -- creating the site needs admin scope,
      # and the workflow token is not given that no matter what permissions
      # this file asks for.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
