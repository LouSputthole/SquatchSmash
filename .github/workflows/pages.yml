# Publish the complete campaign to GitHub Pages.
#
# The game is plain ES modules with no build step, so "deploying" is just
# copying the repository somewhere that serves files over HTTP. That is the
# whole point of the vendored three.js and the importmap in index.html.
#
# This is the full game: every scene, voice clip, and track is published.
name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces an older queued one but
# never cancels a deploy that is already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Fail the build rather than the browser: a manifest naming a file that
      # is not there is a 404 at runtime and a silent fallback in the game.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify the campaign
        run: |
          npm test
          npm run check
          npm run check:flight
          npm run verify:campaign-route

      # Everything the browser asks for, including the two development tools
      # linked from the public preview launcher.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html bing.html squatchfather.html motel.html beefrun.html \
             graveyard.html nowake.html silver.html golf.html heist.html initiation.html \
             silvercase.html mansion.html mansion-siege.html enolasquatch.html \
             cartel-palace.html specialmeeting.html preview.html roster.html \
             wardrobe.html combatlab.html _site/
          cp -r src vendor assets game lib _site/
          test -f _site/nowake.html
          test -f _site/graveyard.html
          test -f _site/heist.html
          test -f _site/golf.html
          test -f _site/silvercase.html
          test -f _site/mansion.html
          test -f _site/mansion-siege.html
          test -f _site/enolasquatch.html
          test -f _site/cartel-palace.html
          test -f _site/combatlab.html
          test -f _site/specialmeeting.html
          test -f _site/src/nowake/main.js
          test -f _site/src/graveyard/main.js
          test -f _site/src/heist/main.js
          test -f _site/src/golf/main.js
          test -f _site/src/silvercase/main.js
          test -f _site/src/mansion/main.js
          test -f _site/src/mansion/siege/main.js
          test -f _site/src/enolasquatch/main.js
          test -f _site/src/cartel-palace/main.js
          test -f _site/src/combatlab/main.js
          test -f _site/src/specialmeeting/main.js
          test -f _site/lib/jsm/postprocessing/EffectComposer.js
          test -f _site/lib/jsm/postprocessing/UnrealBloomPass.js
          grep -q 'src/nowake/main.js' _site/nowake.html
          grep -q 'src/golf/main.js' _site/golf.html
          grep -q 'src/mansion/siege/main.js' _site/mansion-siege.html
          grep -q 'src/cartel-palace/main.js' _site/cartel-palace.html
          grep -q 'src/combatlab/main.js' _site/combatlab.html
          grep -q 'src/specialmeeting/main.js' _site/specialmeeting.html
          grep -q '../../lib/jsm/postprocessing/EffectComposer.js' _site/src/initiation/main.js
          node tools/verify-pages-routes.mjs _site
          echo "Staged $(du -sh _site | cut -f1)"

      # Pages has to be switched on once, by hand, before this can deploy:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # `enablement: true` cannot do it -- creating the site needs admin scope,
      # and the workflow token is not given that no matter what permissions
      # this file asks for.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
