# Publish the apartment to GitHub Pages.
#
# The game is plain ES modules with no build step, so "deploying" is just
# copying the repository somewhere that serves files over HTTP. That is the
# whole point of the vendored three.js and the importmap in index.html.
#
# This is the full game, unlike dist/squatch-apartment.html: every voice clip,
# every track, nothing dropped for a size budget.
name: Pages

on:
  push:
    branches:
      - main
      - claude/apartment-game-squatch-smash-5aw8oc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces an older queued one but
# never cancels a deploy that is already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fail the build rather than the browser: a manifest naming a file that
      # is not there is a 404 at runtime and a silent fallback in the game.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the manifests
        run: node tools/check.mjs

      # Everything the browser asks for, and nothing else. The tools only run
      # here and on a developer's machine; they are no use to a visitor.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src vendor assets _site/
          echo "Staged $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
